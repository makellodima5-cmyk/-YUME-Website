name: Android client build

on:
  push:
    branches:
      - feat/android-app
  pull_request:
    branches:
      - feat/android-app

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Lint Android-specific files
        run: bunx eslint src/lib/mobile-api.ts src/lib/mobile-api.android.ts src/routes/api.mobile.catalog.ts src/routes/api.mobile.anime.ts vite.android.config.ts capacitor.config.ts
      - name: Build existing Cloudflare app
        run: bun run build
      - name: Build bundled Android web client
        run: bun run build:android:web
      - name: Inspect generated app shell files
        if: always()
        run: |
          echo 'dist/client:'
          find dist/client -maxdepth 2 -type f -print 2>/dev/null | sort || true
          echo '.output/public:'
          find .output/public -maxdepth 2 -type f -print 2>/dev/null | sort || true
      - name: Verify standalone app shell
        run: |
          test -f dist/client/index.html
          if grep -q 'telegram.org/js/telegram-web-app.js' dist/client/index.html; then
            echo 'Android shell must not load the Telegram WebApp script.'
            exit 1
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Sync Capacitor Android platform
        run: bunx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yume-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
