name: Temporary dependency remediation
on:
  push:
    branches:
      - security/hardening-2026-10-26
    paths:
      - .github/workflows/dependency-remediation.yml
permissions:
  contents: write
jobs:
  patch-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: security/hardening-2026-10-26
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Update vulnerable dependency resolutions
        run: |
          bun install --frozen-lockfile
          bun audit fix
      - name: Commit patched lockfile
        run: |
          if git diff --quiet -- bun.lock bun.lockb package.json; then
            echo "No dependency changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock bun.lockb package.json 2>/dev/null || true
          git commit -m "security: update vulnerable dependency resolutions"
          git push origin HEAD:security/hardening-2026-10-26
