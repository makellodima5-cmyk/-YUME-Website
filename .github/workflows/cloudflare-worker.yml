name: Cloudflare Worker CI

on:
  push: {}
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies for high and critical vulnerabilities
        run: bun audit --audit-level=high

      - name: Run automated tests
        run: bun run test

      - name: Lint TypeScript sources
        run: >-
          bunx eslint src
          --rule 'prettier/prettier: off'

      - name: Build Cloudflare Worker
        run: bun run build

      - name: Verify generated Worker configuration, entry, Cron hook and D1 binding
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = ".output/server/wrangler.json";
          if (!fs.existsSync(path)) {
            throw new Error(`Expected Nitro Cloudflare output at ${path}; build did not emit the deployable Worker config.`);
          }
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          console.log("Generated Nitro Wrangler config:", JSON.stringify(config, null, 2));
          const nitroConfigPath = ".wrangler/deploy/config.json";
          if (fs.existsSync(nitroConfigPath)) {
            console.log("Nitro deploy config:", fs.readFileSync(nitroConfigPath, "utf8"));
          }
          const binding = (config.d1_databases ?? []).find(
            (item) => item.binding === "YUME_DB"
              && item.database_name === "yume_db"
              && item.database_id === "29aea579-e316-413f-922b-44c17b12f45a",
          );
          if (!binding) {
            throw new Error("Generated Worker config does not contain the expected YUME_DB binding.");
          }
          const rootConfig = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          if (rootConfig.main !== ".output/server/index.mjs" || !fs.existsSync(rootConfig.main)) {
            throw new Error("Root Wrangler config must target the built Nitro Worker entry.");
          }
          if (rootConfig.assets?.directory !== ".output/public" || !fs.existsSync(rootConfig.assets.directory)) {
            throw new Error("Root Wrangler config must target the generated public assets.");
          }
          if (rootConfig.assets?.run_worker_first !== true) {
            throw new Error("HTTP-to-HTTPS redirect must run before any static asset is served.");
          }
          if (!Array.isArray(rootConfig.triggers?.crons) || !rootConfig.triggers.crons.includes("* * * * *")) {
            throw new Error("Root Wrangler config does not include the expected per-minute Cron trigger.");
          }
          if (!Array.isArray(config.triggers?.crons) || !config.triggers.crons.includes("* * * * *")) {
            throw new Error("Generated Nitro Wrangler config does not preserve the expected Cron trigger.");
          }

          // Verify the deployable Worker artifact itself. Source-only tests can pass
          // while the actual Nitro entry has no registered scheduled callback.
          const workerEntry = fs.readFileSync(rootConfig.main, "utf8");
          if (!/callHook\(["']cloudflare:scheduled["']/.test(workerEntry)) {
            throw new Error("Generated Worker entry has no Cloudflare scheduled-hook dispatch.");
          }
          if (!workerEntry.includes("[YUME][TRAILER_AUTO] Nitro scheduled hook received.")) {
            throw new Error("Generated Worker entry has no registered trailer update scheduled-hook subscriber.");
          }
          if (workerEntry.includes("runScheduledCatalogMetadataRefresh")) {
            throw new Error("Catalog metadata refresh must not be scheduled; it is manual-only.");
          }
          if (!workerEntry.includes("runScheduledTrailerUpdate")) {
            throw new Error("Generated Worker entry does not include the configured trailer update job.");
          }
          console.log("Verified generated Worker entry dispatches Cloudflare Cron only to the configured trailer updater.");

          console.log("Verified generated Worker config, root entry, assets, Cron trigger, and YUME_DB binding.");
          NODE

      - name: Validate Wrangler deploy artifact
        run: bunx wrangler@4 deploy --dry-run --config wrangler.jsonc
