name: Cloudflare Worker CI

on:
  push: {}
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies for high and critical vulnerabilities
        run: bun audit --audit-level=high

      - name: Run automated tests
        run: bun run test

      - name: Lint TypeScript sources
        run: >-
          bunx eslint src
          --rule 'prettier/prettier: off'

      - name: Build Cloudflare Worker
        run: bun run build

      - name: Verify generated Worker configuration, entry, Cron hook, D1, KV and Queue bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = ".output/server/wrangler.json";
          if (!fs.existsSync(path)) {
            throw new Error(`Expected Nitro Cloudflare output at ${path}; build did not emit the deployable Worker config.`);
          }
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          console.log("Generated Nitro Wrangler config:", JSON.stringify(config, null, 2));
          const nitroConfigPath = ".wrangler/deploy/config.json";
          if (fs.existsSync(nitroConfigPath)) {
            console.log("Nitro deploy config:", fs.readFileSync(nitroConfigPath, "utf8"));
          }
          const binding = (config.d1_databases ?? []).find(
            (item) => item.binding === "YUME_DB"
              && item.database_name === "yume_db"
              && item.database_id === "29aea579-e316-413f-922b-44c17b12f45a",
          );
          if (!binding) {
            throw new Error("Generated Worker config does not contain the expected YUME_DB binding.");
          }
          const kvBinding = (config.kv_namespaces ?? []).find(
            (item) => item.binding === "YUME_SHIKIMORI_CACHE"
              && item.id === "598c5207a7054b3eb45e2efe8214f5d7",
          );
          if (!kvBinding) {
            throw new Error("Generated Worker config does not contain the expected YUME_SHIKIMORI_CACHE binding.");
          }
          const rootConfig = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          if (rootConfig.main !== ".output/server/index.mjs" || !fs.existsSync(rootConfig.main)) {
            throw new Error("Root Wrangler config must target the built Nitro Worker entry.");
          }
          if (rootConfig.assets?.directory !== ".output/public" || !fs.existsSync(rootConfig.assets.directory)) {
            throw new Error("Root Wrangler config must target the generated public assets.");
          }
          if (rootConfig.assets?.run_worker_first !== true) {
            throw new Error("HTTP-to-HTTPS redirect must run before any static asset is served.");
          }
          if (Array.isArray(rootConfig.triggers?.crons) && rootConfig.triggers.crons.length > 0) {
            throw new Error("Automatic scheduled Worker jobs must remain disabled.");
          }
          const queueProducer = (rootConfig.queues?.producers ?? []).find(
            (item) => item.binding === "YUME_WEB_TASKS" && item.queue === "yume-web-tasks",
          );
          if (!queueProducer) {
            throw new Error("Site Worker config is missing the YUME_WEB_TASKS Queue producer.");
          }
          const queueConfig = JSON.parse(fs.readFileSync("wrangler.queue.jsonc", "utf8"));
          const queueConsumer = (queueConfig.queues?.consumers ?? []).find(
            (item) => item.queue === "yume-web-tasks"
              && item.max_batch_size === 2
              && item.max_concurrency === 1
              && item.max_retries === 5
              && item.dead_letter_queue === "yume-web-tasks-dlq",
          );
          const cleanupCron = queueConfig.triggers?.crons ?? [];
          if (cleanupCron.length !== 1 || cleanupCron[0] !== "0 3 * * *") {
            throw new Error("Queue consumer Worker must run the daily notification cleanup cron.");
          }
          const queueDatabase = (queueConfig.d1_databases ?? []).find(
            (item) => item.binding === "YUME_DB"
              && item.database_id === "29aea579-e316-413f-922b-44c17b12f45a",
          );
          if (!queueConsumer || !queueDatabase || queueConfig.main !== "src/queue-worker.ts") {
            throw new Error("Queue consumer Worker config is missing its bounded consumer, DLQ, D1 binding or entrypoint.");
          }
          const queueEntry = fs.readFileSync(queueConfig.main, "utf8");
          if (!queueEntry.includes("handleEpisodeNotificationQueue")) {
            throw new Error("Dedicated Queue Worker entry does not invoke the episode notification consumer.");
          }
          if (!queueEntry.includes("runScheduledNotificationCleanup")) {
            throw new Error("Dedicated Queue Worker entry does not invoke scheduled notification cleanup.");
          }
          if (!queueEntry.includes("runScheduledEpisodeNotifications")) {
            throw new Error("Dedicated Queue Worker entry does not invoke scheduled episode notifications.");
          }
          if (queueConfig.workers_dev !== false || queueConfig.preview_urls !== false) {
            throw new Error("Queue consumer must not expose public workers.dev or preview URLs.");
          }
          const rootKvBinding = (rootConfig.kv_namespaces ?? []).find(
            (item) => item.binding === "YUME_SHIKIMORI_CACHE"
              && item.id === "598c5207a7054b3eb45e2efe8214f5d7",
          );
          if (!rootKvBinding) {
            throw new Error("Root Wrangler config is missing the expected YUME_SHIKIMORI_CACHE binding.");
          }
          const expectedRateLimits = [
            { name: "KODIK_RATE_LIMITER", namespaceId: "202610271", limit: 30, period: 60 },
            { name: "MEDIA_RATE_LIMITER", namespaceId: "202610272", limit: 600, period: 60 },
            { name: "CSP_REPORT_RATE_LIMITER", namespaceId: "202610273", limit: 30, period: 60 },
          ];
          for (const expected of expectedRateLimits) {
            const binding = (rootConfig.ratelimits ?? []).find((item) => item.name === expected.name);
            if (
              !binding ||
              binding.namespace_id !== expected.namespaceId ||
              binding.simple?.limit !== expected.limit ||
              binding.simple?.period !== expected.period
            ) {
              throw new Error(`Root Wrangler config is missing the expected ${expected.name} rate-limit binding.`);
            }
          }
          if (Array.isArray(config.triggers?.crons) && config.triggers.crons.length > 0) {
            throw new Error("Generated Worker config must not enable scheduled automatic jobs.");
          }
          const workerEntry = fs.readFileSync(rootConfig.main, "utf8");
          for (const scheduledJob of ["runScheduledCatalogStatusRefresh", "runScheduledCatalogMetadataRefresh", "runScheduledTrailerUpdate", "runScheduledEpisodeNotifications", "runScheduledKodikAvailabilityRefresh"]) {
            if (workerEntry.includes(scheduledJob)) {
              throw new Error(`Generated Worker entry still includes scheduled job ${scheduledJob}.`);
            }
          }

          console.log("Verified site and dedicated Queue Worker configs, entries, assets, Cron trigger, D1 and KV bindings.");
          NODE

      - name: Validate site Worker deploy artifact
        run: bunx wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Validate Queue consumer Worker deploy artifact
        run: bunx wrangler@4 deploy --dry-run --config wrangler.queue.jsonc

      # Production deployments are owned by Cloudflare Workers Builds.
      # Keep GitHub Actions as validation-only to avoid two competing deploy pipelines.
